name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: kinesis_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    defaults:
      run:
        working-directory: kinesis-frontend

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/kinesis_test
      AUTH_SECRET: ci-test-secret-please-rotate-in-production-0000
      AUTH_TRUST_HOST: "true"
      KINESIS_CHECKPOINT_SECRET: ci-checkpoint-secret

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: kinesis-frontend/package-lock.json

      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run lint

      - name: Migrate test DB
        run: |
          for f in db/migrations/001_agent.sql db/migrations/002_commerce.sql db/migrations/004_checkpoint_hardening.sql db/migrations/005_orders_idempotency_promo.sql db/migrations/006_rate_limit.sql; do
            psql "$DATABASE_URL" -f "$f"
          done

      - run: npm test
      - run: npm run build
